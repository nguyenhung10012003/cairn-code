name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.9

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the Seatbelt sandbox and image tests, which Linux skips.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  package:
    name: npm package (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile

      - name: Pack
        # prepack runs build:npm, which writes dist/cli.js.
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check the tarball holds only the bundle, README and manifest
        run: |
          files=$(tar -tzf "$RUNNER_TEMP"/cairn-code-*.tgz | sort | tr '\n' ' ')
          echo "$files"
          test "$files" = "package/README.md package/dist/cli.js package/package.json "

      - name: Install globally
        run: npm install -g "$RUNNER_TEMP"/cairn-code-*.tgz

      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        env:
          CAIRN_HOME: ${{ runner.temp }}/cairn-home
          CAIRN_SCRIPT: ${{ runner.temp }}/script.json
        run: |
          cairn --version
          echo '[{"toolCalls":[{"name":"Bash","input":{"command":"echo smoke > out.txt"}}]},{"text":"done"}]' > "$CAIRN_SCRIPT"
          reply=$(cairn --provider scripted -p go --dangerously-skip-permissions < /dev/null)
          test "$reply" = "done"
          test "$(cat out.txt)" = "smoke"
          # Without CAIRN_SCRIPT, the built-in mock rules answer, so they must be in the bundle.
          CAIRN_SCRIPT='' cairn --provider scripted -p 'run echo built-in rules' --dangerously-skip-permissions < /dev/null | grep -q 'built-in rules'
